name: AI Test Analysis

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

env:
  TZ: Asia/Seoul
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # -----------------------------
      # Python
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI dependencies
        working-directory: ai
        run: pip install -r requirements.txt

      - name: Train model
        working-directory: ai
        run: python train_model.py

      # -----------------------------
      # Initialize error log
      # -----------------------------
      - name: Initialize error log
        run: |
          : > error.log

      # -----------------------------
      # Server test
      # -----------------------------
      - name: Run server tests
        id: server_tests
        continue-on-error: true
        working-directory: server
        run: |
          echo "===================================" >> ../error.log
          echo "SERVER TEST" >> ../error.log
          echo "Started At: $(date '+%Y-%m-%d %H:%M:%S %Z')" >> ../error.log
          echo "===================================" >> ../error.log

          set -o pipefail
          npm test -- --run --reporter=verbose | tee -a ../error.log

          echo "Finished At: $(date '+%Y-%m-%d %H:%M:%S %Z')" >> ../error.log

      # -----------------------------
      # AI test
      # -----------------------------
      - name: Run AI tests
        id: ai_tests
        continue-on-error: true
        working-directory: ai
        run: |
          echo "===================================" >> ../error.log
          echo "AI TEST" >> ../error.log
          echo "Started At: $(date '+%Y-%m-%d %H:%M:%S %Z')" >> ../error.log
          echo "===================================" >> ../error.log

          set -o pipefail
          pytest 2>&1 | tee -a ../error.log

          echo "Finished At: $(date '+%Y-%m-%d %H:%M:%S %Z')" >> ../error.log

      # -----------------------------
      # Gemini analysis
      # -----------------------------
      - name: Analyze test error
        if: steps.server_tests.outcome == 'failure' || steps.ai_tests.outcome == 'failure'
        run: python ai/analyze_error.py
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash

      # -----------------------------
      # Final result
      # -----------------------------
      - name: Check test result
        if: steps.server_tests.outcome == 'failure' || steps.ai_tests.outcome == 'failure'
        run: exit 1

      # -----------------------------
      # Upload logs
      # -----------------------------
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            error.log
            analysis.log
          if-no-files-found: warn
