name: AI Test Analysis

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # -----------------------------
      # Python
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI dependencies
        working-directory: ai
        run: pip install -r requirements.txt

      - name: Train model
        working-directory: ai
        run: python train_model.py

      # -----------------------------
      # Initialize error log
      # -----------------------------
      - name: Initialize error log
        run: |
          : > error.log

      # -----------------------------
      # Server test
      # -----------------------------
      - name: Run server tests
        id: server_tests
        continue-on-error: true
        working-directory: server
        run: |
          echo "========== SERVER TEST ==========" >> ../error.log
          set -o pipefail
          npm test -- --run 2>&1 | tee -a ../error.log

      # -----------------------------
      # AI test
      # -----------------------------
      - name: Run AI tests
        id: ai_tests
        continue-on-error: true
        working-directory: ai
        run: |
          echo "========== AI TEST ==========" >> ../error.log
          set -o pipefail
          pytest 2>&1 | tee -a ../error.log

      # -----------------------------
      # Gemini analysis
      # -----------------------------
      - name: Analyze test error
        if: steps.server_tests.outcome == 'failure' || steps.ai_tests.outcome == 'failure'
        run: python ai/analyze_error.py
        env:
          GEMINI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash

      # -----------------------------
      # Final result
      # -----------------------------
      - name: Check test result
        if: steps.server_tests.outcome == 'failure' || steps.ai_tests.outcome == 'failure'
        run: exit 1
